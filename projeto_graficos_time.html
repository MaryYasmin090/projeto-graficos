<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desempenho do Time 2020-2024</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:30px;color:#222}
.container{max-width:1000px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 4px 18px #bbb}
h1{text-align:center;margin-bottom:8px}
p{text-align:center;color:#555}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:25px}
.card{border:1px solid #ddd;border-radius:14px;padding:18px;background:#fff}
canvas{max-height:360px}
table{width:100%;border-collapse:collapse;margin-top:30px}
th,td{padding:12px;text-align:center;border-bottom:1px solid #ddd}
th{background:#eee}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Desempenho do Time de Futebol</h1>
<p>Comparação dos campeonatos de 2020 a 2024</p>

<div class="grid">
<div class="card"><h2>Vitórias por ano</h2><canvas id="vitorias"></canvas></div>
<div class="card"><h2>Gols marcados por ano</h2><canvas id="gols"></canvas></div>
<div class="card"><h2>Vitórias × Gols</h2><canvas id="relacao"></canvas></div>
<div class="card"><h2>Distribuição das vitórias</h2><canvas id="pizza"></canvas></div>
</div>

<table>
<tr><th>Ano</th><th>Vitórias</th><th>Gols Marcados</th></tr>
<tr><td>2020</td><td>8</td><td>24</td></tr>
<tr><td>2021</td><td>10</td><td>30</td></tr>
<tr><td>2022</td><td>6</td><td>18</td></tr>
<tr><td>2023</td><td>12</td><td>36</td></tr>
<tr><td>2024</td><td>14</td><td>42</td></tr>
</table>
</div>

<script>
const anos=['2020','2021','2022','2023','2024'];
const v=[8,10,6,12,14], g=[24,30,18,36,42];

new Chart(document.getElementById('vitorias'),{type:'bar',data:{labels:anos,datasets:[{label:'Vitórias',data:v}]},options:{responsive:true}});
new Chart(document.getElementById('gols'),{type:'line',data:{labels:anos,datasets:[{label:'Gols marcados',data:g,tension:.2}]},options:{responsive:true}});
new Chart(document.getElementById('relacao'),{type:'scatter',data:{datasets:[{label:'Vitórias × Gols',data:v.map((x,i)=>({x:x,y:g[i]}))}]},options:{responsive:true,scales:{x:{title:{display:true,text:'Vitórias'}},y:{title:{display:true,text:'Gols marcados'}}}}});
new Chart(document.getElementById('pizza'),{type:'pie',data:{labels:anos,datasets:[{label:'Vitórias',data:v}]},options:{responsive:true}});
</script>
</body>
</html>
